server {
    listen 80;
    server_name aqtilink.live;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fallback to index.html
    location / {
        try_files $uri /index.html;
    }

    # Serve static files with caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|json)$ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # CSP for Clerk + your backend + own scripts
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net https://clerk.aqtilink.com https://*.clerk.dev;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src 'self' https://api.clerk.dev https://clerk.aqtilink.com https://aqtilink.live;
        font-src 'self' https://fonts.gstatic.com;
        frame-src https://clerk.aqtilink.com https://*.clerk.dev;
    ";

    # Proxy /api requests to backend (optional if backend is separate)
    location /api/ {
        proxy_pass http://backend:8081/;  # adjust container name/port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
