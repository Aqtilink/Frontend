server {
    listen 80;
    server_name aqtilink.live;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy to activity-service
    location /api/v1/activities {
        proxy_pass http://activity-service:8081/api/v1/activities;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy to user-service
    location /api/v1/users {
        proxy_pass http://user-service:8080/api/v1/users;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing: fallback to index.html
    location / {
        try_files $uri /index.html;
    }

    # Serve static files with caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|json)$ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # CSP for Clerk + your backend + own scripts
    # Single-line CSP to avoid invalid header formatting
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://clerk.aqtilink.live https://*.clerk.dev https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://clerk.aqtilink.live https://*.clerk.dev https://api.clerk.com https://aqtilink.live; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com; font-src 'self' https://fonts.gstatic.com; frame-src https://accounts.google.com https://clerk.aqtilink.live https://*.clerk.dev;";

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
